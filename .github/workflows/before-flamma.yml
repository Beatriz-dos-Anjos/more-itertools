name: Test Flaky Pipeline
on:
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-rerunfailures
      
      - name: Run tests with reruns
        run: |
          pytest --reruns 3 --junitxml=ci_results.xml
        continue-on-error: true
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ci_results.xml

  run-flamma:
    needs: install-and-test
    uses: Beatriz-dos-Anjos/FlaMMA-Flaky-Mitigation-Monitoring-Approach/.github/workflows/detector.yml@v1
    with:
      reruns: 3
